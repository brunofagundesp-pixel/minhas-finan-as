<div class="login-shell">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-brand-row">
        <img class="login-logo" src="assets/img/favicon/android-chrome-192x192.png" alt="Logo Previsa" />
        <h1 class="login-title">Previsa</h1>
      </div>
    </div>

    <form class="login-form" (ngSubmit)="loginWithEmailPassword()" novalidate>
      <div class="form-field">
        <label for="email">E-mail</label>
        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          autocomplete="email"
          placeholder="voce@email.com"
          required
        />
      </div>

      <div class="form-field">
        <label for="password">Senha</label>
        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          autocomplete="current-password"
          placeholder="••••••••"
          required
        />
        <span class="form-field-hint">Nova por aqui? Basta digitar uma senha e sua conta é criada automaticamente.</span>
      </div>

      <div class="session-preferences">
        <label class="session-checkbox">
          <input type="checkbox" name="trustBrowser" [(ngModel)]="trustBrowser" />
          <span>Confiar neste navegador</span>
        </label>

        <label class="session-days" *ngIf="trustBrowser">
          Manter login por
          <div class="session-day-options" role="group" aria-label="Tempo de sessao confiavel">
            <button
              type="button"
              class="session-day-option"
              *ngFor="let option of trustDayOptions"
              [class.session-day-option--active]="trustDays === option.value"
              (click)="trustDays = option.value"
              [attr.aria-pressed]="trustDays === option.value"
            >
              {{ option.label }}
            </button>
          </div>
        </label>

        <span class="session-hint" *ngIf="!trustBrowser">A sessao sera encerrada ao fechar o navegador.</span>
      </div>

      <p class="login-error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>

      <button class="btn-primary" type="submit" [disabled]="loading">
        {{ loading ? 'Entrando...' : 'Entrar / Criar conta' }}
      </button>
    </form>

    <div class="login-divider">
      <span>ou</span>
    </div>

    <button class="btn-google" type="button" (click)="loginWithGoogle()" [disabled]="loading">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        <path fill="none" d="M0 0h48v48H0z"/>
      </svg>
      Entrar com Google
    </button>
  </div>
</div>
